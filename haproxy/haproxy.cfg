defaults
    mode http
    timeout client 10s
    timeout connect 5s
    timeout server 10s 
    timeout http-request 10s

frontend myfrontend
    bind *:9000
    default_backend myservers

frontend mystats
    bind *:9103
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s

backend myservers
    server server1 192.168.0.213:5000 check
    server server2 192.168.0.213:5001 check
    server server3 192.168.0.213:5002 check
