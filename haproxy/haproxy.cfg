global
    log stdout format raw local0

defaults
    timeout connect 10s
    timeout client 30s
    timeout server 30s
    log global
    mode http
    option httplog

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s
    hold valid      10s
    hold obsolete   10s

frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST

frontend frontend_api
    bind *:9020
    default_backend backend_api

frontend frontend_receiver
    bind *:9050
    default_backend backend_receiver

frontend frontend_stats
    bind *:9103
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s

backend backend_api
    balance roundrobin
    server-template api- 2 api:6000 check resolvers docker inter 3s

    # server s1 api_1:6000 check inter 3s
    # server s2 api_2:6000 check inter 3s

backend backend_receiver
    balance roundrobin
    server-template receiver- 3 receiver:7000 check resolvers docker inter 3s

    # server s1 receiver_1:7000 check inter 3s
    # server s2 receiver_2:7000 check inter 3s
    # server s3 receiver_3:7000 check inter 3s

listen cockroach
    balance roundrobin
    bind :26257
    option tcplog
    mode tcp
    option httpchk GET /health?ready=1
    server s1 cockroach_1:26257 check port 8080
    server s2 cockroach_2:26258 check port 8081
    server s3 cockroach_3:26259 check port 8082
