version: '3.9'

networks:

  simple:

services:

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    environment:
      - discovery.type=single-node
      - ELASTIC_HOST=${ELASTIC_HOST}
      - ELASTIC_PORT=${ELASTIC_PORT}
      - LS_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.license.self_generated.type=basic
      - xpack.security.enabled=false
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://${ELASTIC_HOST}:${ELASTIC_PORT}']
      interval: 10s
      timeout: 2s
      retries: 2
    networks:
      - simple
    restart: unless-stopped
    volumes:
      - elastic:/usr/share/elasticsearch/data

  filebeat:
    depends_on:
      - elastic
    image: docker.elastic.co/beats/filebeat:${FILEBEAT_VERSION}
    environment:
      - output.elasticsearch.hosts=["${ELASTIC_HOST}:${ELASTIC_PORT}"]
      - setup.kibana.host=${KIBANA_HOST}:${KIBANA_PORT}
    networks:
      - simple
    restart: unless-stopped

  kibana:
    depends_on:
      - elastic
    image: docker.elastic.co/kibana/kibana:${KIBANA_VERSION}
    environment:
      - ELASTICSEARCH_HOSTS=http://${ELASTIC_HOST}:${ELASTIC_PORT}
    networks:
      - simple
    ports:
      - ${KIBANA_PORT}:${KIBANA_PORT}
    restart: unless-stopped
    volumes:
      - kibana:/usr/share/kibana/config

  logstash:
    depends_on:
      - elastic
    environment:
      - LS_JAVA_OPTS=-Xms1g -Xmx1g
    image: docker.elastic.co/logstash/logstash:${LOGSTASH_VERSION}
    networks:
      - simple
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./logstash/config/logstash.yml
        target: /usr/share/logstash/config/logstash.yml
        read_only: true
      - type: bind
        source: ./logstash/pipeline
        target: /usr/share/logstash/pipeline
        read_only: true

volumes:
  chronograf:
  cockroach:
  elastic:
  grafana_etc:
  grafana_var_lib:
  influx:
  kafka:
  kibana:
  mongo:
  postgres:
  redis:
  redis_insight:
