global:
  scrape_interval: 1m
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'haproxy'
    static_configs:
      - targets: ['haproxy:8404']
  - job_name: 'nakama'
    static_configs:
      - targets: ['nakama:9104']
  - job_name: 'nodes'
    static_configs:
      - targets: ['node-exporter:9100', 'statsd-exporter:9102']
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: 'rabbit'
    static_configs:
      - targets: ['rabbit-1:15692']
