global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'codelab-monitor'

scrape_configs:
  - job_name: 'haproxy'
    static_configs:
      - targets: ['haproxy:9103']
  - job_name: 'nodes'
    static_configs:
    - targets: ['node_exporter:9100', 'statsd_exporter:9102']
  - job_name: nakama
      metrics_path: /
      static_configs:
        - targets: ['nakama:9100']
  - job_name: 'prometheus'
    static_configs:
    - targets: ['localhost:9090']
  - job_name: 'rabbit'
    static_configs:
      - targets: ['rabbit:15692']
