<source>
   @type forward
</source>

<match __DISABLED__.**>
   @type copy

   <store>
      @type stdout
   </store>
</match>

<match *.**>
   @type copy

   <store>
      @type elasticsearch

      host elastic
      port 9200
      logstash_format true
      logstash_prefix fluentd
      logstash_dateformat %Y%m%d
      include_tag_key true
      type_name access_log
      tag_key @log_name
      flush_interval 1s
   </store>
</match>
