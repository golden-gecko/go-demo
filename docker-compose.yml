version: '3.9'

x-logging:
  &default-logging
  driver: "fluentd"
  options:
    fluentd-address: localhost:${FLUENT_PORT}

networks:
  main:
    ipam:
      config:
        - subnet: 192.168.50.0/24

services:
  api_1:
    build:
      context: api
    networks:
      main:
        ipv4_address: 192.168.50.20
    ports:
      - ${API_PORT}:${API_PORT}
    restart: unless-stopped

  api_2:
    build:
      context: api
    networks:
      main:
        ipv4_address: 192.168.50.21
    ports:
      - 5001:${API_PORT}
    restart: unless-stopped

  cockroach_1:
    command: start --insecure --join=cockroach_1,cockroach_2,cockroach_3
    image: cockroachdb/cockroach:v${COCKROACH_VERSION}
    networks:
      - main
    ports:
      - ${COCKROACH_PORT}:${COCKROACH_PORT}
      - 7681:8080
    restart: unless-stopped
    volumes:
      - cockroach_1:/data/db

  cockroach_2:
    command: start --insecure --join=cockroach_1,cockroach_2,cockroach_3
    image: cockroachdb/cockroach:v${COCKROACH_VERSION}
    networks:
      - main
    ports:
      - 26258:${COCKROACH_PORT}
      - 7682:8080
    restart: unless-stopped
    volumes:
      - cockroach_2:/data/db

  cockroach_3:
    command: start --insecure --join=cockroach_1,cockroach_2,cockroach_3
    image: cockroachdb/cockroach:v${COCKROACH_VERSION}
    networks:
      - main
    ports:
      - 26259:${COCKROACH_PORT}
      - 7683:8080
    restart: unless-stopped
    volumes:
      - cockroach_3:/data/db

  consumer_1:
    build:
      context: consumer
    networks:
      - main
    restart: unless-stopped

  consumer_2:
    build:
      context: consumer
    networks:
      - main
    restart: unless-stopped

  fluent:
    build:
      context: fluent
    networks:
      - main
    ports:
      - ${FLUENT_PORT}:${FLUENT_PORT}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./fluent/fluent.conf
        target: /fluentd/etc/fluent.conf

  grafana:
    build:
      context: grafana
    networks:
      - main
    ports:
      - ${GRAFANA_PORT}:${GRAFANA_PORT}
    restart: unless-stopped
    volumes:
      - grafana_etc:/etc/grafana
      - grafana_var_lib:/var/lib/grafana

  haproxy:
    image: haproxy:${HAPROXY_VERSION}
    networks:
      main:
        ipv4_address: 192.168.50.10
    ports:
      - 9020:9020
      - 9050:9050
      - 9103:9103
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./haproxy/haproxy.cfg
        target: /usr/local/etc/haproxy/haproxy.cfg

  influx:
    environment:
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
      - DOCKER_INFLUXDB_INIT_BUCKET=house
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_ORG=my-org
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_RETENTION=1w
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USER}
    image: influxdb:${INFLUX_VERSION}
    networks:
      - main
    ports:
      - ${INFLUX_PORT}:${INFLUX_PORT}
    restart: unless-stopped
    volumes:
      - influx:/var/lib/influxdb

  mongo:
    environment:
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
    image: mongo:${MONGO_VERSION}
    networks:
      - main
    ports:
      - ${MONGO_PORT}:${MONGO_PORT}    
    restart: unless-stopped
    volumes:
      - mongo:/data/db

  mongo_express:
    environment:
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_PASSWORD}
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_USER}
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/
    image: mongo-express:${MONGO_EXPRESS_VERSION}
    networks:
      - main
    ports:
      - ${MONGO_EXPRESS_PORT}:${MONGO_EXPRESS_PORT}
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:v${NODE_EXPORTER_VERSION}
    networks:
      - main
    ports: 
      - ${NODE_EXPORTER_PORT}:${NODE_EXPORTER_PORT}
    restart: unless-stopped

  node:
    build:
      context: node
    networks:
      - main
    ports:
      - ${NODE_PORT}:${NODE_PORT}
    restart: unless-stopped

  producer:
    build:
      context: producer
    networks:
      - main
    restart: unless-stopped

  prometheus:
    depends_on:
      - haproxy
      - node_exporter
      - rabbit
      - statsd_exporter
    image: prom/prometheus:v${PROMETHEUS_VERSION}
    networks:
      - main
    ports:
      - ${PROMETHEUS_PORT}:${PROMETHEUS_PORT}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true

  rabbit:
    build:
      context: rabbit
    networks:
      - main
    ports:
      - ${RABBIT_PORT}:${RABBIT_PORT}
    restart: unless-stopped

  receiver_1:
    build:
      context: receiver
    networks:
      main:
        ipv4_address: 192.168.50.30
    ports:
      - ${RECEIVER_PORT}:${RECEIVER_PORT}
    restart: unless-stopped

  receiver_2:
    build:
      context: receiver
    networks:
      main:
        ipv4_address: 192.168.50.31
    ports:
      - 7001:${RECEIVER_PORT}
    restart: unless-stopped

  receiver_3:
    build:
      context: receiver
    networks:
      main:
        ipv4_address: 192.168.50.32
    ports:
      - 7002:${RECEIVER_PORT}
    restart: unless-stopped

  statsd_exporter:
    image: prom/statsd-exporter:v${STATSD_EXPORTER_VERSION}
    networks:
      - main
    ports:
      - ${STATSD_EXPORTER_PORT}:${STATSD_EXPORTER_PORT}
    restart: unless-stopped

volumes:
  chronograf:
  cockroach_1:
  cockroach_2:
  cockroach_3:
  elastic:
  grafana_etc:
  grafana_var_lib:
  influx:
  kafka:
  kibana:
  mongo:
  postgres:
  redis:
  redis_insight:
