apiVersion: v1
kind: Pod
metadata:
  name: mongos
spec:
  volumes:
    - name: mongo-claim
      persistentVolumeClaim:
        claimName: mongo-claim
  containers:
    - name: mongo
      image: registry.com.gecko/mongo
      imagePullPolicy: Always
      ports:
        - containerPort: 27017
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
      volumeMounts:
        - mountPath: "/data/db"
          name: mongo-claim
