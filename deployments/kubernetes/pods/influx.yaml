apiVersion: v1
kind: Pod
metadata:
  name: influx
  labels:
    app: influx
spec:
  volumes:
    - name: influx-claim
      persistentVolumeClaim:
        claimName: influx-claim
  containers:
    - name: influx
      image: registry.com.gecko/influx
      imagePullPolicy: Always
      ports:
        - containerPort: 8086
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
      volumeMounts:
        - mountPath: "/var/lib/influxdb2"
          name: influx-claim
