apiVersion: v1
kind: Pod
metadata:
  name: rabbit
spec:
  containers:
    - name: rabbit
      image: registry.com.gecko/rabbit
      imagePullPolicy: Always
      ports:
        - containerPort: 5672
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
