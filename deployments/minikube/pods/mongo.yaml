apiVersion: v1
kind: Pod
metadata:
  name: mongo
  labels:
    app: mongo
spec:
  volumes:
    - name: mongo-claim
      persistentVolumeClaim:
        claimName: mongo-claim
  containers:
    - name: mongo
      image: registry.com.gecko/mongo
      imagePullPolicy: Always
      env:
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: "go_password"
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "go_user"
      ports:
        - containerPort: 27017
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "500m"
      volumeMounts:
        - mountPath: "/data/db"
          name: mongo-claim
