version: '3.9'

networks:
  main:
    enable_ipv6: false
    ipam:
      config:
        - subnet: 192.168.100.0/24

services:
  jenkins:
    image: jenkins/jenkins:2.426.2-jdk17
    networks:
      - main
    restart: unless-stopped
    volumes:
      - jenkins:/var/jenkins_home

  registry:
    image: registry:2.8.3
    networks:
      - main
    restart: unless-stopped

volumes:
  jenkins:
