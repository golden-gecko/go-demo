- Kibana - http://localhost:5601/

version: '3.9'

x-logging:
  &default-logging
  driver: "fluentd"
  options:
    fluentd-address: localhost:${FLUENT_PORT}

networks:
  main:

services:
  fluent:
    build:
      context: fluent
    networks:
      - main
    ports:
      - ${FLUENT_PORT}:${FLUENT_PORT}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./fluent/fluent.conf
        target: /fluentd/etc/fluent.conf

  logstash:
    environment:
      - LS_JAVA_OPTS=-Xms1g -Xmx1g
    image: docker.elastic.co/logstash/logstash:${LOGSTASH_VERSION}
    networks:
      - main
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./logstash/config/logstash.yml
        target: /usr/share/logstash/config/logstash.yml
        read_only: true
      - type: bind
        source: ./logstash/pipeline
        target: /usr/share/logstash/pipeline
        read_only: true

  kafka:
    depends_on:
      - zookeeper
    environment:
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://192.168.0.213:${KAFKA_PORT}
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:${KAFKA_PORT}
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:${ZOOKEEPER_PORT}
    image: bitnami/kafka:${KAFKA_VERSION}
    networks:
      - main
    ports:
      - ${KAFKA_PORT}:${KAFKA_PORT}
    restart: unless-stopped

  kafka_ui:
    depends_on:
      - kafka
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=192.168.0.213:${KAFKA_PORT}
    image: provectuslabs/kafka-ui:${KAFKA_UI_VERSION}
    networks:
      - main
    ports:
      - ${KAFKA_UI_PORT}:${KAFKA_UI_PORT}
    restart: unless-stopped

  nginx:
    image: nginx:${NGINX_VERSION}
    networks:
      - main
    ports:
      - ${NGINX_PORT}:${NGINX_PORT}
    restart: unless-stopped

  zookeeper:
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    image: bitnami/zookeeper:${ZOOKEEPER_VERSION}
    networks:
      - main
    ports:
      - ${ZOOKEEPER_PORT}:${ZOOKEEPER_PORT}
    restart: unless-stopped

  postgres:
    build:
      context: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    healthcheck:
      test: ["CMD", "psql", "-d", "${POSTGRES_DATABASE}", "-U", "${POSTGRES_USER}", "-c", "select 1"]
      interval: 10s
      timeout: 2s
      retries: 2
    networks:
      - main
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    restart: unless-stopped
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  chronograf:
  cockroach_1:
  cockroach_2:
  cockroach_3:
  grafana_etc:
  grafana_var_lib:
  influx:
  kafka:
  mongo:
  postgres:
  redis:
  redis_insight:
