version: '3.9'

networks:
  main:
    enable_ipv6: false
    ipam:
      config:
        - subnet: 192.168.100.0/24

services:
  jenkins:
    build:
      context: jenkins
    networks:
      - main
    ports:
      - 8888:8080
    restart: unless-stopped
    volumes:
      - jenkins:/var/jenkins_home

  registry:
    image: registry:2.8.3
    networks:
      - main
    ports:
      - 5000:5000
    restart: unless-stopped
    volumes:
      - registry:/registry-data

volumes:
  jenkins:
  registry:
