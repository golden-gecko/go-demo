version: '3.9'

networks:
  main:
    enable_ipv6: false
    ipam:
      config:
        - subnet: 192.168.200.0/24

services:
  bind9:
    build:
      context: bind9
    environment:
      - TZ=UTC
    networks:
      main:
        ipv4_address: 192.168.200.10
    ports:
      - 53:53/tcp
      - 53:53/udp
    restart: unless-stopped

  nginx:
    build:
      context: nginx
    networks:
      main:
        ipv4_address: 192.168.200.20
    ports:
      - 80:80
      - 443:443
    restart: unless-stopped

  jenkins:
    build:
      context: jenkins
    networks:
      main:
        ipv4_address: 192.168.200.30
    ports:
      - 8888:8080
    restart: unless-stopped
    volumes:
      - jenkins:/var/jenkins_home

  registry:
    image: registry:2.8.3
    networks:
      main:
        ipv4_address: 192.168.200.40
    ports:
      - 5000:5000
    restart: unless-stopped
    volumes:
      - registry:/registry-data

  registry-ui:
    environment:
      - NGINX_PROXY_PASS_URL=http://registry.com.gecko:5000
    image: joxit/docker-registry-ui:2.5.6-debian
    networks:
      main:
        ipv4_address: 192.168.200.50
    ports:
      - 9999:80
    restart: unless-stopped
    volumes:
      - registry:/registry-data

volumes:
  jenkins:
  registry:
